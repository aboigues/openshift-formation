# L'API de Télémarché, telle qu'on la versionne après l'avoir prototypée avec
# « oc new-app » : configuration dans une ConfigMap, réplicas, ressources.
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  labels:
    app.kubernetes.io/part-of: telemarche
data:
  LOG_LEVEL: info
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/part-of: telemarche
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        app.kubernetes.io/part-of: telemarche
    spec:
      # Durcissement standard du dépôt : ne pas modifier. Ni runAsUser ni
      # fsGroup : c'est OpenShift (restricted-v2) qui les choisit.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Le nom complet, registre compris : sur OpenShift, un nom court peut
          # être refusé ou résolu vers un registre inattendu.
          image: docker.io/telemachlearning/telemarche-api:1.0
          envFrom:
            - configMapRef:
                name: api-config
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 64Mi
---
# L'adresse stable de l'API DANS le cluster : http://api:8080
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app: api
    app.kubernetes.io/part-of: telemarche
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8080
      targetPort: http
