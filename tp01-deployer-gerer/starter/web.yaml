# La vitrine de Télémarché : Deployment, Service, et la Route qui la publie.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: telemarche
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/part-of: telemarche
    spec:
      # Durcissement standard du dépôt : ne pas modifier. Ni runAsUser ni
      # fsGroup : c'est OpenShift (restricted-v2) qui les choisit.
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/telemachlearning/telemarche-web:1.0
          env:
            # Où la vitrine relaie /api/ : le Service de l'API, port compris.
            - name: API_URL
              value: ______        # TODO 6 : l'adresse du Service de l'API, avec son port
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 16Mi
            limits:
              memory: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: telemarche
spec:
  selector:
    app: web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# Le nom d'hôte HORS du cluster. Pas de « host » : OpenShift le génère
# (<route>-<projet>.apps.<cluster>), et le manifeste reste valable partout.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/part-of: telemarche
spec:
  to:
    kind: ______                  # TODO 7 : vers quel type d'objet une Route envoie-t-elle le trafic ?
    name: web
  port:
    targetPort: http
  tls:
    termination: ______                     # TODO 8 : le routeur déchiffre, puis parle en clair au pod
    insecureEdgeTerminationPolicy: ______   # TODO 9 : http:// doit être renvoyé vers https://
