name: TP — vérification

# Quatre barrières :
#   1. lint     : contrôles statiques (trous, YAML, labels, shellcheck).
#   1 bis. securite : secrets, fautes de configuration des manifestes et des
#                Dockerfile, vulnérabilités du code Go et des images
#                (scripts/securite.sh). Trivy tourne depuis son image officielle,
#                épinglée ; les actions GitHub sont épinglées par empreinte.
#   2. images  : tout ce qui se prouve sans OpenShift. Les images sont construites
#                puis lancées avec un UID arbitraire et le groupe 0, comme sur
#                OpenShift ; les prémisses des TP (ce qui doit échouer) sont rejouées.
#   3. okd     : verify.sh solution de chaque TP sur un vrai OKD, dans le
#                workflow okd.yml (runner auto-hébergé, voir docs/gate-okd.md).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Contrôles statiques
        run: ./scripts/lint.sh

  securite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Secrets, manifestes, code Go, images
        run: MOTEUR=docker ./scripts/securite.sh

  images:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Go — gofmt et go vet (dans go-toolset, la chaîne des TP)
        run: |
          set -euo pipefail
          docker run --rm -u 0 -v "$PWD/apps":/apps:ro registry.access.redhat.com/ubi10/go-toolset:10.3 sh -c '
            cp -r /apps /tmp/apps && cd /tmp/apps/telemarche &&
            test -z "$(gofmt -l .)" && go vet ./... &&
            cd ../bonjour && test -z "$(gofmt -l .)" && go vet ./...'

      - name: Images de Télémarché sous UID arbitraire
        working-directory: apps/telemarche
        run: |
          set -euo pipefail
          docker build -q -f Dockerfile.api --build-arg APP_VERSION=ci -t api:ci .
          docker build -q -f Dockerfile.web --build-arg APP_VERSION=ci -t web:ci .
          docker build -q --build-arg COMPOSANT=web -t generique:ci .
          docker run --rm --user 12345:0 --read-only api:ci --self-test
          docker run -d --name api --user 12345:0 --read-only -p 8080:8080 api:ci
          docker run -d --name web --user 12345:0 --read-only -p 8081:8080 web:ci
          sleep 6
          curl -fsS localhost:8080/ready
          curl -fsS localhost:8080/version | grep '"version":"ci"'
          curl -fsS localhost:8081/version | grep '"service":"web"'

      - name: TP02 — l'image historique échoue, la solution démarre et s'arrête proprement
        run: |
          set -euo pipefail
          for v in heritage solution; do
            rm -rf "/tmp/$v"; cp -R apps/telemarche "/tmp/$v"; cp -R tp02-concevoir-image/$v/. "/tmp/$v/"
            docker build -q -t "tp02-$v:ci" "/tmp/$v"
          done
          if docker run --rm --user 12345:0 tp02-heritage:ci > /tmp/heritage.log 2>&1; then
            echo "::error::l'image historique démarre sous UID arbitraire : le TP02 n'a plus d'objet"; exit 1
          fi
          grep -q "permission denied" /tmp/heritage.log
          docker run -d --name tp02 --user 12345:0 -p 8082:8080 tp02-solution:ci
          sleep 6
          curl -fsS localhost:8082/version
          docker logs tp02 2>&1 | grep -q "journal des commandes ouvert"
          debut=$SECONDS; docker stop -t 30 tp02 >/dev/null
          [ $((SECONDS - debut)) -lt 20 ] || { echo "::error::arrêt en plus de 20 s"; exit 1; }

      - name: TP04 — la version défectueuse compile mais échoue au self-test
        run: |
          set -euo pipefail
          rm -rf /tmp/panne; cp -R apps/telemarche /tmp/panne
          cp tp04-build-hooks/pannes/catalogue.json /tmp/panne/cmd/api/catalogue.json
          docker build -q -f /tmp/panne/Dockerfile.api -t panne:ci /tmp/panne
          if docker run --rm panne:ci --self-test; then
            echo "::error::le self-test accepte le catalogue défectueux"; exit 1
          fi

      - name: TP05 — go-toolset seul échoue, les scripts .s2i et l'image de construction réussissent
        run: |
          set -euo pipefail
          rm -rf /tmp/s2i; mkdir /tmp/s2i; cp -R apps/telemarche /tmp/s2i/src
          printf 'FROM registry.access.redhat.com/ubi10/go-toolset:10.3\nCOPY --chown=1001:0 src /tmp/src\nRUN /usr/libexec/s2i/assemble\n' > /tmp/s2i/Dockerfile
          if docker build -q -t n0:ci /tmp/s2i >/dev/null 2>&1; then
            echo "::error::go-toolset construit Télémarché sans script : le TP05 n'a plus d'objet"; exit 1
          fi
          cp -R tp05-personnaliser-s2i/solution/depot/.s2i /tmp/s2i/src/
          printf 'FROM registry.access.redhat.com/ubi10/go-toolset:10.3\nCOPY --chown=1001:0 src /tmp/src\nENV COMPOSANT=web\nRUN /tmp/src/.s2i/bin/assemble\nCMD ["/tmp/src/.s2i/bin/run"]\n' > /tmp/s2i/Dockerfile
          docker build -q -t n2:ci /tmp/s2i
          MOTEUR=docker ./builders/telemach-go-builder/test/run

      - name: TP06 — l'API publiée migre, puis sert ses commandes depuis PostgreSQL
        run: |
          set -euo pipefail
          modele=tp06-modele-multi-conteneurs/solution/telemarche.yaml
          pg=$(python3 -c 'import sys,yaml; print(next(p["value"] for p in yaml.safe_load(open(sys.argv[1]))["parameters"] if p["name"]=="POSTGRESQL_IMAGE"))' "$modele")
          api=docker.io/telemachlearning/telemarche-api:$(python3 -c 'import sys,yaml; print(next(p["value"] for p in yaml.safe_load(open(sys.argv[1]))["parameters"] if p["name"]=="APP_VERSION"))' "$modele")
          docker network create tp06
          docker run -d --name db --network tp06 --user 12345:0 \
            -e POSTGRESQL_USER=telemarche -e POSTGRESQL_PASSWORD=ci -e POSTGRESQL_DATABASE=telemarche "$pg"
          i=0; until docker exec db /usr/libexec/check-container; do i=$((i+1)); [ "$i" -lt 60 ] || exit 1; sleep 2; done
          env=(-e DB_HOST=db -e DB_USER=telemarche -e DB_PASSWORD=ci -e DB_NAME=telemarche)
          docker run --rm --network tp06 --user 23456:0 --read-only "${env[@]}" --entrypoint /app/migrate "$api"
          docker run -d --name api6 --network tp06 --user 23456:0 --read-only -p 8086:8080 "${env[@]}" "$api"
          sleep 6
          curl -fsS localhost:8086/ready
          curl -fsS -X POST -H 'Content-Type: application/json' -d '{"product_id":1,"quantity":2}' localhost:8086/api/orders
          docker restart db >/dev/null
          i=0; until curl -fsS localhost:8086/ready >/dev/null 2>&1; do i=$((i+1)); [ "$i" -lt 60 ] || exit 1; sleep 2; done
          curl -fsS localhost:8086/api/orders | grep -q '"id":1,'

      - name: TP07 — l'API publiée démarre lentement et se vide à l'arrêt
        run: |
          set -euo pipefail
          docker run -d --name t7 --user 12345:0 --read-only -p 8087:8080 \
            -e STARTUP_SECONDS=8 -e SHUTDOWN_SECONDS=5 docker.io/telemachlearning/telemarche-api:1.0
          sleep 3
          [ "$(curl -s -o /dev/null -w '%{http_code}' localhost:8087/healthz)" = 503 ] || { echo "::error::/healthz répond pendant le démarrage"; exit 1; }
          sleep 8
          curl -fsS localhost:8087/healthz
          ( sleep 2; curl -s -o /dev/null -w '%{http_code}' localhost:8087/ready > /tmp/ready-arret; curl -fsS localhost:8087/version > /tmp/version-arret ) &
          docker stop -t 30 t7 >/dev/null; wait
          [ "$(cat /tmp/ready-arret)" = 503 ] || { echo "::error::/ready ne passe pas à 503 pendant la vidange"; exit 1; }
          grep -q '"version":"1.0"' /tmp/version-arret || { echo "::error::l'API ne sert plus pendant la vidange"; exit 1; }

      - name: TP08 — Télécaisse construite par wildfly-s2i, reliée à sa base et à Télémarché
        run: |
          set -euo pipefail
          builder=$(python3 -c 'import sys,yaml; print(next(d for d in yaml.safe_load_all(open(sys.argv[1])) if d["kind"]=="BuildConfig")["spec"]["strategy"]["sourceStrategy"]["from"]["name"])' tp08-integrer-migrer/solution/build.yaml)
          rm -rf /tmp/tc; mkdir /tmp/tc; cp -R apps/telecaisse /tmp/tc/src
          printf 'FROM %s\nCOPY --chown=185:0 src /tmp/src\nRUN /usr/local/s2i/assemble\nCMD ["/usr/local/s2i/run"]\n' "$builder" > /tmp/tc/Dockerfile
          docker build -q -t telecaisse:ci /tmp/tc
          pg=$(python3 -c 'import sys,yaml; print(next(p["value"] for p in yaml.safe_load(open(sys.argv[1]))["parameters"] if p["name"]=="POSTGRESQL_IMAGE"))' tp06-modele-multi-conteneurs/solution/telemarche.yaml)
          docker network create tp08
          docker run -d --name si-caisse --network tp08 --user 12345:0 \
            -e POSTGRESQL_USER=caisse -e POSTGRESQL_PASSWORD=ci -e POSTGRESQL_DATABASE=caisse "$pg"
          docker run -d --name api8 --network tp08 --network-alias api --user 12346:0 docker.io/telemachlearning/telemarche-api:1.1
          i=0; until docker exec si-caisse /usr/libexec/check-container; do i=$((i+1)); [ "$i" -lt 60 ] || exit 1; sleep 2; done
          docker exec -i si-caisse psql -q -U caisse -d caisse < apps/telecaisse/sql/schema.sql
          docker run -d --name tc --network tp08 --user 23458:0 --memory 768m -p 8088:8080 \
            -e POSTGRESQL_HOST=si-caisse -e POSTGRESQL_USER=caisse -e POSTGRESQL_PASSWORD=ci -e POSTGRESQL_DATABASE=caisse \
            -e TELEMARCHE_API_URL=http://api:8080 telecaisse:ci
          i=0; until curl -fsS localhost:8088/api/sante/prete; do i=$((i+1)); [ "$i" -lt 90 ] || { docker logs tc | tail -30; exit 1; }; sleep 2; done
          curl -fsS localhost:8088/api/tickets | grep -q caisse-magasin-1
          vente=$(curl -fsS -X POST -H 'Content-Type: application/json' -d '{"produit":2,"quantite":3}' localhost:8088/api/ventes)
          echo "$vente"
          echo "$vente" | grep -q '"montantCentimes":3750'
